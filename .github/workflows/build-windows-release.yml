name: Build and Release Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build-windows:
    name: Build and sign Windows x64 installer
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies without prebuilding native modules
        shell: pwsh
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          npm ci --ignore-scripts
          npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.4

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Build web production files
        shell: pwsh
        env:
          GITHUB_PAGES: 'false'
          ELECTRON_BUILD: 'true'
        run: npm run build

      - name: Build Electron files
        run: npm run build:electron


      - name: Build unsigned Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify generated unsigned installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No Windows installer was generated in release/.'
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA256: $((Get-FileHash $installer.FullName -Algorithm SHA256).Hash)"
          Write-Host "Signature status: $($signature.Status)"
          if ($signature.Status -eq 'Valid') {
            Write-Warning 'This workflow is intended for unsigned testing, but the installer is signed.'
          } else {
            Write-Warning "Unsigned test build confirmed: $($signature.Status)"
          }

      - name: Create unsigned GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.0.0-unsigned.${{ github.run_number }}
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' | Select-Object -First 1
          $blockmap = Get-ChildItem -Path release -Filter '*.blockmap' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer not found.' }
          $assets = @($installer.FullName)
          if ($null -ne $blockmap) { $assets += $blockmap.FullName }
          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GH_REPO `
            --target $env:GITHUB_SHA `
            --title "صهوة للخياطة $env:RELEASE_TAG (Unsigned)" `
            --notes "Unsigned Windows test build. SmartScreen may show an Unknown Publisher warning. Do not use this build as the final signed production release." `
            --prerelease

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sahwa-windows-installer-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
