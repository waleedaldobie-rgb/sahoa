name: Windows Packaged Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Optional exact commit SHA to test'
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  windows-packaged-acceptance:
    name: Build, install, and test Windows package
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit || github.event.pull_request.head.sha || github.sha }}

      - name: Resolve expected commit
        id: identity
        shell: pwsh
        env:
          REQUESTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($env:REQUESTED_COMMIT -and $commit -ne $env:REQUESTED_COMMIT) {
            throw "Checked out commit '$commit' does not match requested '$env:REQUESTED_COMMIT'."
          }
          "SAHWA_EXPECTED_COMMIT=$commit" >> $env:GITHUB_ENV
          "commit=$commit" >> $env:GITHUB_OUTPUT
          Write-Host "Testing commit: $commit"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        shell: pwsh
        env:
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          npm ci --ignore-scripts
          npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.4 @playwright/test

      - name: Quality gate
        run: npm run quality

      - name: Unit tests
        run: npm test -- --run --reporter=dot

      - name: Build renderer
        shell: pwsh
        env:
          GITHUB_PAGES: 'false'
          ELECTRON_BUILD: 'true'
        run: npm run build

      - name: Build Electron files
        run: npm run build:electron

      - name: Run SQLite integration regression
        shell: pwsh
        run: npx electron --no-sandbox scripts/integration-regression.cjs

      - name: Build unsigned Windows NSIS installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      - name: Verify installer and write SHA-256
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*Setup*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'No Windows Setup.exe was generated in release/.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          $shaFile = Join-Path $env:GITHUB_WORKSPACE 'release\SHA256SUMS.txt'
          "file=$($installer.Name)" | Set-Content -Path $shaFile -Encoding utf8
          "sha256=$hash" | Add-Content -Path $shaFile -Encoding utf8
          "commit=$env:SAHWA_EXPECTED_COMMIT" | Add-Content -Path $shaFile -Encoding utf8
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA-256: $hash"

      - name: Install Setup.exe into isolated test directory
        id: install
        shell: pwsh
        env:
          INSTALL_DIR: ${{ runner.temp }}\SahwaTailoring-Automation
          TEST_DATA_DIR: ${{ runner.temp }}\SahwaTailoring-Data
          EVIDENCE_DIR: ${{ github.workspace }}\test-results\windows-packaged-acceptance
        run: |
          foreach ($path in @($env:INSTALL_DIR, $env:TEST_DATA_DIR, $env:EVIDENCE_DIR)) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }
          $process = Start-Process -FilePath '${{ steps.installer.outputs.installer }}' -ArgumentList @('/S', "/D=$env:INSTALL_DIR") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }
          $installedExe = Get-ChildItem -Path $env:INSTALL_DIR -Filter '*.exe' -Recurse -File |
            Where-Object { $_.Name -notmatch 'uninstall|setup' } | Select-Object -First 1
          if ($null -eq $installedExe) { throw 'Installed Electron executable was not found.' }
          "SAHWA_EXE=$($installedExe.FullName)" >> $env:GITHUB_ENV
          "SAHWA_TEST_DATA=$env:TEST_DATA_DIR" >> $env:GITHUB_ENV
          "SAHWA_EVIDENCE_DIR=$env:EVIDENCE_DIR" >> $env:GITHUB_ENV
          Write-Host "Installed executable: $($installedExe.FullName)"

      - name: Run Windows Packaged Acceptance
        shell: pwsh
        run: |
          node scripts/windows-acceptance-installed.mjs
          if ($LASTEXITCODE -ne 0) { throw "Packaged Acceptance failed with exit code $LASTEXITCODE." }

      - name: Validate acceptance evidence
        shell: pwsh
        run: |
          $resultsPath = Join-Path $env:SAHWA_EVIDENCE_DIR 'acceptance-results.json'
          if (-not (Test-Path $resultsPath)) { throw "Acceptance evidence not found: $resultsPath" }
          $results = Get-Content -Raw $resultsPath | ConvertFrom-Json
          if ($results.commit -ne $env:SAHWA_EXPECTED_COMMIT) {
            throw "Evidence commit '$($results.commit)' does not match '$env:SAHWA_EXPECTED_COMMIT'."
          }
          $nonPass = @($results.results | Where-Object { $_.status -ne 'PASS' })
          if ($nonPass.Count -gt 0) {
            $ids = ($nonPass | ForEach-Object { $_.id }) -join ', '
            throw "Acceptance contains non-PASS results: $ids"
          }
          if (@($results.runtimeErrors).Count -gt 0) { throw 'Acceptance reported runtime errors.' }
          "WINDOWS_PACKAGED_ACCEPTANCE=PASS commit=$env:SAHWA_EXPECTED_COMMIT" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sahwa-windows-acceptance-${{ steps.identity.outputs.commit }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
            test-results/windows-packaged-acceptance/**

      - name: Cleanup isolated install directory
        if: always()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'SahwaTailoring-Automation'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue }
